name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24

      - name: Update npm
        run: npm install -g npm@latest

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm vitest run

      - name: Publish package
        run: pnpm stage publish --no-git-checks
